[project]
name = "tp1-fake-news"
version = "0.1.0"
description = "TP1 - Fake news detection with a pre-trained language model (PLM)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "datasets>=2.20",
    "evaluate>=0.4",
    "accelerate>=0.33",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy<2.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "google-genai>=0.3",
    "python-dotenv>=1.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
]
